  Vertical 9:16 social stage for AmigosNest.

  Rendered by scripts/social-video/render.mjs: Playwright opens this page at
  1080x1920, the page animates itself from `window.__AMIGOS_TIMELINE__` (injected
  before load), and the recorder captures it. Audio is muxed in post, so the
  stage is intentionally silent.

  Open it directly in a browser (file:// works) to preview: it falls back to the
  timeline in scripts/social-video/lines.mjs with estimated voiceover lengths.
  Query params for review:  ?scene=s4   ?time=12.5   ?scale=0.5   ?font=1.6
-->
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
  }
  #stage {
    width: 1080px;
    height: 1920px;
    transform-origin: top left;
    position: absolute;
    top: 0;
    left: 0;
  }
  #stage svg { display: block; width: 1080px; height: 1920px; }

  /* ── scene / variant visibility ─────────────────────────────────────────── */
  .scene { opacity: 0; transition: opacity 0.36s linear; }
  .variant { display: none; }
  .shown { display: inline; }

  /* overlay crossfades snap when the recorder seeks (stills, scene preview). */
  body.instant .scene,
  body.instant #room-tint,
  body.instant #think-light,
  body.instant #screen-answer,
  body.instant #screen-asking,
  body.instant #screen-question { transition: none !important; }

  /* arms, like expressions, are swapped by attribute */
  #daughter-arms[data-arm="write"] [data-when="write"],
  #daughter-arms[data-arm="idle"] [data-when="idle"],
  #daughter-arms[data-arm="chin"] [data-when="chin"],
  #daughter-arms[data-arm="raise"] [data-when="raise"],
  #mother-arms[data-arm="desk"] [data-when="desk"],
  #mother-arms[data-arm="point"] [data-when="point"],
  #mother-arms[data-arm="hug"] [data-when="hug"] { display: inline; }

  /* ── life: a slow breath so held frames are never frozen ───────────────── */
  @keyframes breathe {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  #daughter, #daughter-arms { animation: breathe 4.4s ease-in-out infinite; }
  #mother, #mother-arms { animation: breathe 5.4s ease-in-out infinite; }

  @keyframes screen-pulse {
    0% { filter: brightness(1); }
    35% { filter: brightness(1.07); }
    100% { filter: brightness(1); }
  }
  #laptop.pulse { animation: screen-pulse 0.32s ease-out; }

  #daughter[data-expr="asking"] [data-when="asking"],
  #daughter[data-expr="flat"] [data-when="flat"],
  #daughter[data-expr="think"] [data-when="think"],
  #daughter[data-expr="aha"] [data-when="aha"],
  #daughter[data-expr="write"] [data-when="write"],
  #daughter[data-expr="pose"] [data-when="pose"] { display: inline; }

  #mother[data-expr="warm"] [data-when="warm"],
  #mother[data-expr="talk"] [data-when="talk"],
  #mother[data-expr="proud"] [data-when="proud"],
  #mother[data-expr="hug"] [data-when="hug"] { display: inline; }

  /* laptop screen states — JS only swaps data-state, CSS picks the visible layer */
  #laptop #screen-idle,
  #laptop #screen-answer,
  #laptop #screen-question,
  #laptop #screen-asking { opacity: 0; }
  #laptop #screen-answer,
  #laptop #screen-asking,
  #laptop #screen-question { transition: opacity 0.28s linear; }
  #laptop[data-state="idle"] #screen-idle { opacity: 1; }
  #laptop[data-state="asking"] #screen-asking { opacity: 1; }
  #laptop[data-state="answer"] #screen-answer { opacity: 1; }
  #laptop[data-state="question"] #screen-question { opacity: 1; }

  #room-tint { transition: opacity .5s linear; }
  .vignette { mix-blend-mode: multiply; }
</style>

/* ─────────────────────────────────────────────────────────────────────────────
   Stage renderer.

   list in window.__AMIGOS_TIMELINE__ (written by scripts/social-video/render.mjs
   from scripts/social-video/{lines,direction}.mjs), which means the picture, the
   voiceover and the sound effects always agree on the same clock.

   API used by the recorder:
     window.__amigos.ready          true once the timeline is loaded
     window.__amigos.play()         start from -preroll (black)
     window.__amigos.seek(t, on)    jump to t seconds, optionally with no tween
   ───────────────────────────────────────────────────────────────────────────── */
(function () {
  const params = new URLSearchParams(location.search);
  const timeline = window.__AMIGOS_TIMELINE__ || {
    target: 32,
    preroll: 1.5,
    fps: 30,
    cardCopy: {
      s7: [
        { l1: "AI shouldn't do", l2: "your child's thinking.", icon: false, bg: 0.62 },
        { l1: "It should help them think.", l2: "", icon: true, bg: 0.72 },
      ],
      s8: [{ l1: "AmigosNest", l2: "An AI thinking companion for kids.", brand: true }],
    },
    // Degraded preview when timeline.js is missing: 4s per scene, no dialogue.
    scenes: ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8"].map((id, i) => ({
      id,
      start: i * 4,
      duration: 4,
    })),
    cues: [],
    events: [],
    warnings: ["timeline.js missing — run: npm run video:social:timeline"],
  };

  const el = (id) => document.getElementById(id);
  const nodes = {
    stage: el("stage"),
    camera: el("camera"),
    daughter: el("daughter"),
    daughterArms: el("daughter-arms"),
    mother: el("mother"),
    motherArms: el("mother-arms"),
    pupilsD: el("d-pupils"),
    pupilsM: el("m-pupils"),
    laptop: el("laptop"),
    tint: el("room-tint"),
    thinkLight: el("think-light"),
    thinkLabel: el("think-label"),
    captions: el("captions"),
    capSpeaker: el("cap-speaker"),
    capT1: el("cap-t1"),
    capT2: el("cap-t2"),
    hook: el("hook"),
    split: el("ov-split"),
    thought: el("ov-thought"),
    cards: el("ov-cards"),
    brand: el("ov-brand"),
    cardBg: el("card-bg"),
    cardText: el("card-text"),
    cardT1: el("card-t1"),
    cardT2: el("card-t2"),
    cardIcon: el("card-icon"),
    brandTitle: document.querySelector("#ov-brand text"),
    brandTagline: document.querySelectorAll("#ov-brand text")[1],
    preroll: el("preroll"),
  };

  const SPEAKER_COLORS = {
    daughter: "#f0a94a",
    mother: "#7fd0c8",
    ai: "#b8bdf0",
    narrator: "#e8d3b8",
  };

  const overlayNodes = {
    hook: nodes.hook,
    split: nodes.split,
    thought: nodes.thought,
    cards: nodes.cards,
    brand: nodes.brand,
  };

  // ── helpers ────────────────────────────────────────────────────────────────
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;

  /** Greedy word wrap into at most `maxLines`, with a smaller-font fallback. */
  function wrap(text, maxChars, maxLines) {
    const words = String(text).split(/\s+/);
    const lines = [];
    let line = "";
    for (const word of words) {
      const candidate = line ? `${line} ${word}` : word;
      if (candidate.length > maxChars && line) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) return wrap(text, maxChars + 14, maxLines);
    return lines;
  }

  // ── state derived from the cue list (stateless, so seeking is exact) ───────
  const camCues = timeline.cues.filter((c) => c.kind === "camera");

  // The room art carries ART_BLEED px of extra wall/floor on every side. Clamp
  // the framing to that margin so a future camera move can never reveal the edge.
  const ART_BLEED = 400;
  const ART_W = 1080;
  const ART_H = 1920;

  function cameraAt(t) {
    let pos = { x: 540, y: 960, scale: 1 };
    for (const cue of camCues) {
      if (cue.at > t) break;
      const { x, y, scale, dur } = cue.value;
      if (!dur || dur <= 0.002) {
        pos = { x, y, scale };
        continue;
      }
      const p = clamp((t - cue.at) / dur, 0, 1);
      const e = easeInOutSine(p);
      pos = { x: lerp(pos.x, x, e), y: lerp(pos.y, y, e), scale: lerp(pos.scale, scale, e) };
      if (p < 1) break;
    }
    pos.scale = clamp(pos.scale, 1, 1.6);
    const safeX = (ART_W / 2 + ART_BLEED) * pos.scale;
    const safeY = (ART_H / 2 + ART_BLEED) * pos.scale;
    pos.x = clamp(pos.x, ART_W - safeX, safeX);
    pos.y = clamp(pos.y, ART_H - safeY, safeY);
    return pos;
  }

  function stateAt(t) {
    const state = {
      expr: { daughter: "write", mother: "warm" },
      arm: { daughter: "write", mother: "desk" },
      laptop: "idle",
      tint: 0,
      think: { light: 0, label: "" },
      caption: null,
      overlays: { hook: false, split: false, thought: false, cards: false, brand: false },
      card: null,
      pulseAt: -99,
    };
    for (const cue of timeline.cues) {
      if (cue.at > t) break;
      const v = cue.value;
      switch (cue.kind) {
        case "expr":
          state.expr[v.who] = v.expr;
          if (v.arm) state.arm[v.who] = v.arm;
          break;
        case "laptop":
          state.laptop = v.state;
          break;
        case "tint":
          state.tint = v.value;
          break;
        case "think":
          state.think.light = v.light;
          if (v.label) state.think.label = v.label;
          break;
        case "overlay":
          state.overlays[v.name] = v.on;
          break;
        case "caption":
          state.caption = v;
          break;
        case "captionEnd":
          state.caption = null;
          break;
        case "card":
          state.card = v;
          break;
        case "sfxVisual":
          if (v.pulse) state.pulseAt = cue.at;
          break;
        default:
          break;
      }
    }
    return state;
  }

  // ── apply ─────────────────────────────────────────────────────────────────
  const last = { exprD: "", exprM: "", armD: "", armM: "", laptop: "", label: "", card: "", pulse: false };

  // Card copy arrives pre-split into two lines, but the second line can be empty
  // (a short line reads better uncut). Font size steps down so a long line never
  // touches the safe area, and the block stays optically centred either way.
  function applyCard(copy) {
    if (!copy) return;
    if (copy.brand) {
      nodes.brandTitle.textContent = copy.l1;
      nodes.brandTagline.textContent = copy.l2;
      return;
    }
    const lines = [copy.l1, copy.l2].filter((line) => line && line.length);
    const longest = Math.max(...lines.map((line) => line.length), 1);
    const size = Math.max(40, Math.min(64, Math.floor(880 / (0.5 * longest))));
    const centre = copy.icon ? 742 : 842;
    nodes.cardText.setAttribute("font-size", String(size));
    nodes.cardT1.textContent = lines[0] ?? "";
    nodes.cardT2.textContent = lines[1] ?? "";
    nodes.cardT1.setAttribute("y", String(lines.length > 1 ? centre - 42 : centre + 22));
    nodes.cardT2.setAttribute("y", String(centre + 42));
    nodes.cardIcon.style.opacity = copy.icon ? "1" : "0";
    if (typeof copy.bg === "number") nodes.cardBg.style.opacity = String(copy.bg);
  }

  function applyCaption(caption) {
    if (!caption) {
      if (nodes.captions.style.opacity !== "0") nodes.captions.style.opacity = "0";
      return;
    }
    nodes.captions.style.opacity = "1";
    nodes.capSpeaker.textContent = caption.speaker.toUpperCase();
    nodes.capSpeaker.setAttribute("fill", SPEAKER_COLORS[caption.speaker] ?? "#e8b34f");
    const lines = wrap(caption.text, 40, 2);
    nodes.capT1.textContent = lines[0] ?? "";
    nodes.capT2.textContent = lines[1] ?? "";
  }

  function applyState(t, state) {
    const cam = cameraAt(t);
    nodes.camera.setAttribute(
      "transform",
      `translate(${cam.x.toFixed(2)} ${cam.y.toFixed(2)}) scale(${cam.scale.toFixed(4)}) translate(-540 -960)`,
    );

    if (state.expr.daughter !== last.exprD) {
      nodes.daughter.setAttribute("data-expr", state.expr.daughter);
      last.exprD = state.expr.daughter;
    }
    if (state.expr.mother !== last.exprM) {
      nodes.mother.setAttribute("data-expr", state.expr.mother);
      last.exprM = state.expr.mother;
    }
    if (state.arm.daughter !== last.armD) {
      nodes.daughterArms.setAttribute("data-arm", state.arm.daughter);
      last.armD = state.arm.daughter;
    }
    if (state.arm.mother !== last.armM) {
      nodes.motherArms.setAttribute("data-arm", state.arm.mother);
      last.armM = state.arm.mother;
    }
    if (state.laptop !== last.laptop) {
      nodes.laptop.setAttribute("data-state", state.laptop);
      last.laptop = state.laptop;
    }

    nodes.tint.style.opacity = String(state.tint);
    nodes.thinkLight.style.opacity = String(state.think.light);
    if (state.think.label && state.think.label !== last.label) {
      nodes.thinkLabel.textContent = state.think.label;
      last.label = state.think.label;
    }

    // eyes follow the moment: up when thinking/asking, down when reading
    const pupilY = state.expr.daughter === "think" || state.expr.daughter === "asking" ? -4 : state.expr.daughter === "flat" ? 1 : 0;
    nodes.pupilsD.setAttribute("transform", `translate(0 ${pupilY})`);
    nodes.pupilsM.setAttribute("transform", state.expr.mother === "talk" ? "translate(-4 -1)" : "translate(0 0)");

    for (const [name, node] of Object.entries(overlayNodes)) {
      const on = Boolean(state.overlays[name]);
      const value = on ? "1" : "0";
      if (node.style.opacity !== value) node.style.opacity = value;
    }

    applyCaption(state.caption);

    const cardKey = state.card ? `${state.card.scene}:${state.card.index}` : "";
    if (cardKey !== last.card) {
      last.card = cardKey;
      if (state.card) {
        const copy = (timeline.cardCopy?.[state.card.scene] ?? [])[state.card.index];
        applyCard(copy);
      }
    }

    const pulsing = t >= state.pulseAt && t - state.pulseAt < 0.32;
    if (pulsing !== last.pulse) {
      last.pulse = pulsing;
      nodes.laptop.classList.toggle("pulse", pulsing);
    }
  }

  // ── clock ─────────────────────────────────────────────────────────────────
  let startedAt = null;
  let done = false;

  function render(t) {
    nodes.preroll.style.opacity = t < 0 ? "1" : "0";
    const now = Math.max(t, 0);
    applyState(now, stateAt(now));
    if (!done && t >= timeline.target + 0.35) {
      done = true;
      window.__AMIGOS_DONE__ = true;
    }
  }

  function tick() {
    if (startedAt !== null) render((performance.now() - startedAt) / 1000 - timeline.preroll);
    requestAnimationFrame(tick);
  }

  function setInstant(on) {
    document.body.classList.toggle("instant", on);
  }

  window.__amigos = {
    ready: true,
    timeline,
    play() {
      setInstant(false);
      last.card = "";
      startedAt = performance.now();
      render(-timeline.preroll);
    },
    pause() {
      startedAt = null;
    },
    seek(t, instant) {
      startedAt = null;
      setInstant(Boolean(instant));
      if (instant) void document.body.offsetWidth;
      render(t);
    },
  };

  // ── local preview conveniences (?scale=, ?time=, ?scene=) ─────────────────
  const scaleParam = params.get("scale");
  const scale =
    scaleParam !== null
      ? Number(scaleParam)
      : window.innerHeight >= 1900 && window.innerWidth >= 1070
        ? 1
        : Math.min(1, (window.innerHeight - 16) / 1920, (window.innerWidth - 16) / 1080);
  nodes.stage.style.transform = `scale(${scale})`;

  if (timeline.warnings?.length) console.warn("[amigosnest] " + timeline.warnings.join("\n[amigosnest] "));

  const seekParam = params.get("time");
  const sceneParam = params.get("scene");
  if (seekParam !== null) window.__amigos.seek(Number(seekParam), true);
  else if (sceneParam) {
    const scene = timeline.scenes.find((s) => s.id === sceneParam);
    if (scene) window.__amigos.seek(scene.start + scene.duration * 0.55, true);
  } else if (params.get("pause") === "1") {
    window.__amigos.seek(0, true);
  }

  requestAnimationFrame(tick);
})();

</script>
</body>
</html>
